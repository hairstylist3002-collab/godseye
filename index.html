<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GodsEye Client Test Page</title>
</head>

<body>
    <h1>Welcome to the Client's Page</h1>
    <p>If the script works, a log should have just been sent to your server.</p>

    <script>
        (function() {
            const pageId = "tracked_" + window.location.pathname;
            if (sessionStorage.getItem(pageId)) return;
    
            const payload = {
                url: window.location.href,
                referrer: document.referrer
            };
    
            // UPDATE THIS LINE WITH YOUR NGROK URL
            fetch('https://zeolitic-zion-sociologically.ngrok-free.dev/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                keepalive: true 
            }).then(() => {
                sessionStorage.setItem(pageId, 'true');
                console.log("GodsEye Tracker: Ping sent successfully.");
            }).catch(err => console.error("GodsEye: Failed", err));
        })();
    </script>
</body>

</html>
